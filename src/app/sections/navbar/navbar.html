<nav class="navbar navbar-expand-lg custom-navbar">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" routerLink="/">
            <img 
                class="img-fluid cursor-pointer"
                src="/images/logo/logo.png"
                alt="Oxynika Wellness">
        </a>

        <!-- Desktop Menu -->
        <div class="navbar-content d-flex justify-content-end align-items-center flex-grow-1">

            <ul class="navbar-nav mx-auto d-none d-lg-flex">

                @for (item of navItems; track item.label) {

                    <li class="nav-item cursor-pointer">

                        @if(item.activeRoute){

                        <a
                            class="nav-link"
                            [routerLink]="item.route"
                            [fragment]="item.fragment"
                            routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: item.exact ?? false }">

                            {{ item.label }}

                        </a>

                        } @else {

                        <a
                            class="nav-link"
                            [routerLink]="item.route"
                            [fragment]="item.fragment">

                            {{ item.label }}

                        </a>

                        }

                    </li>

                }

            </ul>

            <div class="navbar-actions">

                <button class="icon-btn">
                    <i class="bi bi-search"></i>
                </button>

                <button class="icon-btn d-none d-lg-flex">
                    <i class="bi bi-heart"></i>
                </button>

                <button class="icon-btn position-relative">
                    <i class="bi bi-bag"></i>
                    <span class="cart-count">0</span>
                </button>

                <button class="icon-btn d-none d-lg-flex">
                    <i class="bi bi-person"></i>
                </button>

                <!-- Mobile Toggle -->

                <button
                    class="navbar-toggler d-lg-none"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu"
                    aria-controls="mobileMenu"
                    aria-label="Open navigation menu">

                    <i class="bi bi-list"></i>

                </button>


            </div>

        </div>

    </div>

</nav>


<!-- Mobile Offcanvas Menu -->
<div
  class="offcanvas offcanvas-end mobile-menu"
  tabindex="-1"
  id="mobileMenu"
  aria-labelledby="mobileMenuLabel"
>
  <div class="offcanvas-header">
    <a class="navbar-brand" routerLink="/" data-bs-dismiss="offcanvas">
      <img
        src="/images/logo/logo.png"
        alt="Oxynika Wellness"
      />
    </a>

    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="Close menu"
    ></button>
  </div>

  <div class="offcanvas-body">
    <ul class="navbar-nav mobile-nav">
      @for (item of navItems; track item.label) {
        <li class="nav-item">
          @if (item.activeRoute) {
            <a
              class="nav-link"
              [routerLink]="item.route"
              [fragment]="item.fragment"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              data-bs-dismiss="offcanvas"
            >
              {{ item.label }}
              <i class="bi bi-arrow-up-right"></i>
            </a>
          } @else {
            <a
              class="nav-link"
              [routerLink]="item.route"
              [fragment]="item.fragment"
              data-bs-dismiss="offcanvas"
            >
              {{ item.label }}
              <i class="bi bi-arrow-up-right"></i>
            </a>
          }
        </li>
      }
    </ul>

    <div class="mobile-menu-footer">
      <p>Discover your wellness journey.</p>

      <div class="mobile-social-links">
        <button type="button" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
        <button type="button" aria-label="Wishlist">
          <i class="bi bi-heart"></i>
        </button>
        <button type="button" aria-label="Account">
          <i class="bi bi-person"></i>
        </button>
      </div>
    </div>
  </div>
</div>
