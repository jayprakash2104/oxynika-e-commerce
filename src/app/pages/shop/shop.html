<app-header></app-header>

<app-navbar></app-navbar>

<app-hero></app-hero>

<section class="shop">

    <div class="container">

        <!-- Filter Wrapper -->

        <div class="shop-filter-wrapper">

            <!-- Top Row -->

            <div class="filter-header">

                <div class="category-tabs">

                    @for(category of categories; track category){

                    <button type="button" class="tab-pill">

                        {{ category.name }}

                    </button>

                    }

                </div>

            </div>

            <!-- Bottom Row -->

            <div class="shop-toolbar">

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input type="text" placeholder="Search products..." />

                    </div>

                    <div class="sort-box">
                        <div class="custom-sort" (click)="$event.stopPropagation()">
                        <button
                            type="button"
                            class="sort-trigger"
                            aria-label="Sort products"
                            aria-haspopup="listbox"
                            [attr.aria-expanded]="sortDropdownOpen"
                            (click)="sortDropdownOpen = !sortDropdownOpen"
                        >
                            <i class="bi bi-filter-right"></i>
                        </button>
                    
                        @if (sortDropdownOpen) {
                            <div class="sort-dropdown" role="listbox" aria-label="Sort products">
                            @for (sort of sortOptions; track sort) {
                                <button
                                type="button"
                                class="sort-option"
                                role="option"
                                [attr.aria-selected]="selectedSort === sort.label"
                                [class.active]="selectedSort === sort.label"
                                (click)="selectSort(sort)"
                                >
                                {{ sort.label }}
                    
                                @if (selectedSort === sort.label) {
                                    <i class="bi bi-check2"></i>
                                }
                                </button>
                            }
                            </div>
                        }
                        </div>
                    </div>

            </div>
        </div>

        <!-- Products -->

        <div class="row g-4">

            @for(product of products(); track product.id){

            <div class="col-xs-12 col-sm-6 col-md-4 col-xl-3">

                <app-product-card [product]="product">
                </app-product-card>

            </div>

            }

        </div>

        <!-- Pagination -->

        <nav class="shop-pagination">

            <button class="page-btn">

                <i class="bi bi-arrow-left"></i>

            </button>

            <button class="page-number active">

                1

            </button>

            <button class="page-number">

                2

            </button>

            <button class="page-number">

                3

            </button>

            <button class="page-number">

                4

            </button>

            <button class="page-btn">

                <i class="bi bi-arrow-right"></i>

            </button>

        </nav>

    </div>

</section>

<app-footer></app-footer>
